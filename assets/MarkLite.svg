<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- D1 final: dark slate tile, slim white M, wide blue feather hanging
       tip-down as the "down arrow" -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#242B38"/>
      <stop offset="1" stop-color="#141922"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <!-- M, slimmed -->
  <path d="M 44 180 L 44 76 L 88 130 L 132 76 L 132 180"
        fill="none" stroke="#FFFFFF" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- feather, widened: tip down like an arrow -->
  <path d="M 196 60 C 230 94 232 138 198 170 C 166 140 162 96 196 60 Z"
        fill="#5D9BFF"/>
  <path d="M 197 74 L 197 168 M 197 170 L 196 198"
        fill="none" stroke="#8FC0FF" stroke-width="8" stroke-linecap="round"/>
  <!-- arrowhead hint at the quill tip -->
  <path d="M 182 184 L 196 200 L 210 184"
        fill="none" stroke="#8FC0FF" stroke-width="10"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
